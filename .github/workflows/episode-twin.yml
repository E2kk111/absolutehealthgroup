name: Episode Twin reference tests
on:
  pull_request:
    paths: ['episode-twin/**', 'src/features/worldos/**', 'src/pages/WorldOSPage.tsx', 'src/pages/worldos.css', '.github/workflows/episode-twin.yml']
  push:
    branches: [main]
    paths: ['episode-twin/**', 'src/features/worldos/**', 'src/pages/WorldOSPage.tsx', 'src/pages/worldos.css', '.github/workflows/episode-twin.yml']
permissions:
  contents: read
jobs:
  synthetic-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --experimental-strip-types --test episode-twin/tests/*.test.mjs
