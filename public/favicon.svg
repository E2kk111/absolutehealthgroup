<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="healthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="5" y="5" width="90" height="90" rx="18" fill="url(#healthGrad)"/>
  
  <!-- Medical cross symbol (simplified for small size visibility) -->
  <g transform="translate(50, 50)">
    <!-- Vertical line -->
    <rect x="-3" y="-20" width="6" height="40" rx="3" fill="white"/>
    <!-- Horizontal line -->
    <rect x="-20" y="-3" width="40" height="6" rx="3" fill="white"/>
  </g>
  
  <!-- Group indicator - three connected circles at bottom -->
  <g transform="translate(50, 75)">
    <circle cx="-12" cy="0" r="5" fill="white" opacity="0.9"/>
    <circle cx="0" cy="0" r="5" fill="white" opacity="0.9"/>
    <circle cx="12" cy="0" r="5" fill="white" opacity="0.9"/>
    <!-- Connecting lines -->
    <line x1="-7" y1="0" x2="7" y2="0" stroke="white" stroke-width="1.5" opacity="0.7"/>
  </g>
</svg>

